Group=Parsers
IfMatch=^$
IfMatchAction=[!HideMeterGroup RowIP5][!Redraw]
IfNotMatchAction=[!ShowMeterGroup RowIP5][!Redraw]

; ---- Port parsing -- one measure per port. Add/remove blocks to match the
;      $ports list in GetNetworkStatus.ps1 ----
[MeasurePort3000]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)PORT_3000=([^\r\n]*)
UpdateDivider=-1
Group=Parsers
IfMatch=OPEN
IfMatchAction=[!SetOption MeterPort3000Status FontColor "#ColorOpen#"][!SetOption MeterDot3000 FontColor "#ColorOpen#"][!Redraw]
IfNotMatchAction=[!SetOption MeterPort3000Status FontColor "#ColorClosed#"][!SetOption MeterDot3000 FontColor "#ColorClosed#"][!Redraw]

[MeasurePort3000Proc]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)PORT_3000_PROC=([^\r\n]*)
UpdateDivider=-1
Group=Parsers

