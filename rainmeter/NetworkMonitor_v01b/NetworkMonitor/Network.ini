[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Network & Server Ports Monitor
Author=You
Version=1.0
License=Free to use
Description=Shows all local IPv4 addresses and OPEN/CLOSED status of common dev-server ports (5000, 8888, etc.)

;=================================================================
; VARIABLES  -- tweak these
;=================================================================
[Variables]
FontFace=Consolas
FontColorLabel=190,190,190,255
FontColorValue=255,255,255,255
ColorOpen=100,220,120,255
ColorClosed=170,60,60,255
ColorAccent=90,170,255,255
BackgroundColor=18,18,18,220
BorderColor=60,60,60,255
W=360
; how often (ms) the PowerShell probe actually re-runs -- Update above is the UI tick (1s),
; UpdateDivider multiplies that, so 15 means "every 15 seconds"
UpdateDivider=15

; ---- Friendly labels for each port (purely cosmetic, edit freely) ----
; These must correspond to the $ports list in @Resources\Scripts\GetNetworkStatus.ps1
Port3000Name=Node / React
Port4200Name=Angular
Port5000Name=Flask
Port5001Name=Flask
Port5432Name=PostgreSQL
Port8000Name=Django
Port8080Name=HTTP Alt
Port8888Name=Jupyter
Port9000Name=PHP-FPM

;=================================================================
; MEASURES -- run the PowerShell probe
;=================================================================
[MeasureRunScript]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Scripts\GetNetworkStatus.ps1" "#@#network_status.txt"
State=Hide
UpdateDivider=#UpdateDivider#
FinishAction=[!UpdateMeasureGroup Parsers][!Redraw]

; ---- IP address parsing (supports up to 6 NICs; add more blocks if you have more) ----
[MeasureIPCount]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)IPCOUNT=([^\r\n]*)
UpdateDivider=-1
Group=Parsers

[MeasureIP0]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)IP0=([^\r\n]*)
UpdateDivider=-1
Group=Parsers
IfMatch=^$
IfMatchAction=[!HideMeterGroup RowIP0][!Redraw]
IfNotMatchAction=[!ShowMeterGroup RowIP0][!Redraw]

[MeasureIP1]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)IP1=([^\r\n]*)
UpdateDivider=-1
Group=Parsers
IfMatch=^$
IfMatchAction=[!HideMeterGroup RowIP1][!Redraw]
IfNotMatchAction=[!ShowMeterGroup RowIP1][!Redraw]

[MeasureIP2]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)IP2=([^\r\n]*)
UpdateDivider=-1
Group=Parsers
IfMatch=^$
IfMatchAction=[!HideMeterGroup RowIP2][!Redraw]
IfNotMatchAction=[!ShowMeterGroup RowIP2][!Redraw]

[MeasureIP3]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)IP3=([^\r\n]*)
UpdateDivider=-1
Group=Parsers
IfMatch=^$
IfMatchAction=[!HideMeterGroup RowIP3][!Redraw]
IfNotMatchAction=[!ShowMeterGroup RowIP3][!Redraw]

[MeasureIP4]
Measure=Plugin
Plugin=WebParser
Url=file://#@#network_status.txt
RegExp=(?:^|\n)IP4=([^\r\n]*)
UpdateDivider=-1
Group=Parsers
IfMatch=^$
IfMatchAction=[!HideMeterGroup RowIP4][!Redraw]
IfNotMatchAction=[!ShowMeterGroup RowIP4][!Redraw]

[MeasureIP5]
